[package]
name = "triviumdb-cli"
version = "0.8.5"
edition = "2024"
authors = ["YoKONCy <2752026184@qq.com>"]
description = "CLI & TUI tool for TriviumDB — interactive REPL, non-interactive commands, and a full-screen terminal UI."
repository = "https://github.com/YoKONCy/TriviumDB"
license = "Apache-2.0"
readme = "README.md"

# 二进制名为 `tdb`（而非 `triviumdb`）：lib 的 cdylib 产物为 `triviumdb.dll`，
# 与同名 bin 在 Windows 上会产生 `triviumdb.pdb` 输出冲突，故采用简短名 `tdb`。
[[bin]]
name = "tdb"
path = "src/main.rs"

[dependencies]
triviumdb = { path = "../..", default-features = false }

# 核心数据类型
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
half = { version = "2.7.1", features = ["bytemuck", "serde"] }

# CLI 解析与输出
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
tabled = "0.17"
unicode-width = "0.2"
indicatif = "0.17"

# REPL
rustyline = "14"

# TUI
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
