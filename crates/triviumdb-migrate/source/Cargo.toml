[package]
name = "triviumdb-migration-source"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[features]
default = []
python = ["dep:pyo3"]
nodejs = ["dep:napi", "dep:napi-derive"]
usearch-bench = ["dep:usearch"]
test-hooks = []

[dependencies]
target = { package = "triviumdb", path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "1.0"
bincode = "1.3"
rayon = "1.10"
memmap2 = "0.9"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39", "multiple-pymethods"], optional = true }
napi = { version = "2", features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
half = { version = "2.7.1", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
crc32fast = "1.5.0"
sha2 = "0.10"
roaring = "0.11"
fs2 = "0.4.3"
same-file = "1.0"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
aho-corasick = "1.1.4"
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
usearch = { version = "2.25.1", default-features = false, optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
html5gum = { version = "0.9.1", default-features = false }
rpds = { version = "1.2.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
