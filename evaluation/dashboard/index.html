                </button>
                <button data-chart="memory">
                  <span data-i18n="内存 · 吞吐">内存 · 吞吐</span>
                </button>
                <button data-chart="scaling"><span data-i18n="线程扩展">线程扩展</span></button>
                <button data-chart="latency"><span data-i18n="尾延迟">尾延迟</span></button>
                <button data-chart="build"><span data-i18n="构建时间">构建时间</span></button>
                <button data-chart="footprint"><span data-i18n="内存构成">内存构成</span></button>
              </div>
              <label class="check-label">
                <input type="checkbox" id="logAxis" checked />
                <span data-i18n="QPS 对数轴">QPS 对数轴</span>
              </label>
            </div>
            <div class="chart-content">
              <div class="plot-column">
                <div class="canvas-wrap">
                  <canvas
                    id="battleCanvas"
                    aria-label="当前方法的实测性能图"
                    data-i18n-aria-label="当前方法的实测性能图"
                  ></canvas>
                  <div class="empty-overlay" id="chartEmpty" hidden>
                    <span data-i18n="当前条件下没有可绘制的数据">当前条件下没有可绘制的数据</span>
                  </div>
                </div>
                <div class="chart-legend" id="chartLegend"></div>
                <div class="chart-caption">
                  <span id="chartGuidance"></span>
                  <span id="plottedCount"></span>
                </div>
              </div>
              <aside class="point-panel">
                <div class="point-panel-heading">
                  <span id="pointState"><span data-i18n="当前观测">当前观测</span></span>
                  <div class="point-navigation">
                    <button
                      class="icon-button"
                      id="previousPoint"
                      aria-label="上一个观测"
                      data-i18n-aria-label="上一个观测"
                    >
                      ‹
                    </button>
                    <button
                      class="icon-button"
                      id="nextPoint"
                      aria-label="下一个观测"
                      data-i18n-aria-label="下一个观测"
                    >
                      ›
                    </button>
                  </div>
                </div>
                <div id="pointInspector"></div>
                <button class="button wide" id="pointNotes">
                  <span data-i18n="记录与备注 ↗">记录与备注 ↗</span>
                </button>
              </aside>
            </div>
          </section>
          <section class="panel selected-panel">
            <div class="panel-heading">
              <h2><span data-i18n="当前选点明细">当前选点明细</span></h2>
              <div class="actions">
                <div class="segments" id="battleColumns">
                  <button data-columns="core" class="active">
                    <span data-i18n="核心指标">核心指标</span>
                  </button>
                  <button data-columns="full"><span data-i18n="全部指标">全部指标</span></button>
                </div>
                <button class="button" id="exportBattle">
                  <span data-i18n="导出 CSV ↓">导出 CSV ↓</span>
                </button>
              </div>
            </div>
            <div class="table-scroll"><table id="battleTable"></table></div>
          </section>
        </section>
        <section id="exploreView" hidden>
          <div class="record-stats" id="recordStats"></div>
          <section class="panel">
            <div class="panel-heading">
              <h2 id="recordsTitle"><span data-i18n="全部观测">全部观测</span></h2>
              <button class="button" id="exportRecords">
                <span data-i18n="导出筛选结果 ↓">导出筛选结果 ↓</span>
              </button>
            </div>
            <div class="record-filters">
              <label class="field search-field">
                <span><span data-i18n="搜索">搜索</span></span>
                <input
                  type="search"
                  id="recordSearch"
                  placeholder="方法、数据集或参数"
                  data-i18n-placeholder="方法、数据集或参数"
                />
              </label>
              <label class="field">
                <span><span data-i18n="方法">方法</span></span>
                <select id="recordMethod"></select>
              </label>
              <label class="field">
                <span><span data-i18n="方法类别">方法类别</span></span>
                <select id="recordFamily">
                  <option value="all" data-i18n="全部类别">全部类别</option>
                </select>
              </label>
              <label class="field">
                <span><span data-i18n="线程">线程</span></span>
                <select id="recordThread">
                  <option value="all" data-i18n="全部线程">全部线程</option>
                  <option value="1">1T</option>
                  <option value="8">8T</option>
                  <option value="16">16T</option>
                  <option value="32">32T</option>
                </select>
              </label>
              <label class="field">
                <span><span data-i18n="最低召回 / %">最低召回 / %</span></span>
                <input id="recordRecall" type="number" min="0" max="100" step="1" value="0" />
              </label>
            </div>
            <div class="records-toolbar">
              <div class="segments" id="recordColumns">
                <button data-columns="performance" class="active">
                  <span data-i18n="吞吐与召回">吞吐与召回</span>
                </button>
                <button data-columns="latency"><span data-i18n="延迟">延迟</span></button>
                <button data-columns="resources">
                  <span data-i18n="构建与内存">构建与内存</span>
                </button>
                <button data-columns="full"><span data-i18n="全部指标">全部指标</span></button>
              </div>
              <div class="actions">
                <span id="filterResult"></span>
                <button class="text-button" id="clearRecords">
                  <span data-i18n="清空筛选">清空筛选</span>
                </button>
              </div>
            </div>
            <div class="table-scroll record-table">
              <table id="recordsTable"></table>
              <div class="empty-state" id="recordsEmpty" hidden>
                <span data-i18n="没有符合条件的记录">没有符合条件的记录</span>
              </div>
            </div>
            <footer class="pagination">
              <span id="recordRange"></span>
              <div class="actions">
                <label>
                  <span data-i18n="每页">每页</span>
                  <select id="pageSize">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="all" data-i18n="全部">全部</option>
                  </select>
                </label>
                <button
                  class="icon-button"
                  id="previousPage"
                  aria-label="上一页"
                  data-i18n-aria-label="上一页"
                >
                  ‹
                </button>
                <span id="pageLabel"></span>
                <button
                  class="icon-button"
                  id="nextPage"
                  aria-label="下一页"
                  data-i18n-aria-label="下一页"
                >
                  ›
                </button>
              </div>
            </footer>
          </section>
        </section>
        <section id="healthView" hidden>
          <div class="record-stats" id="healthHero"></div>
          <div class="coverage-grid">
            <section class="panel">
              <div class="panel-heading">
                <h2><span data-i18n="指标覆盖">指标覆盖</span></h2>
                <button class="text-button" id="availabilityNotes">
                  <span data-i18n="口径备注 ↗">口径备注 ↗</span>
                </button>
              </div>
              <div class="panel-body" id="availability"></div>
            </section>
            <section class="panel">
              <div class="panel-heading">
                <h2><span data-i18n="数据来源">数据来源</span></h2>
                <a
                  class="text-button"
                  href="../provenance/manifest.json"
                  target="_blank"
                  rel="noopener"
                >
                  <span data-i18n="文件清单 ↗">文件清单 ↗</span>
                </a>
              </div>
              <div class="panel-body" id="sourceStatus"></div>
            </section>
          </div>
          <section class="panel">
            <div class="panel-heading">
              <h2><span data-i18n="方法 × 数据集覆盖">方法 × 数据集覆盖</span></h2>
              <span class="panel-meta">
                <span data-i18n="点击数量查看对应记录">点击数量查看对应记录</span>
              </span>
            </div>
            <div class="table-scroll coverage-table"><table id="coverageTable"></table></div>
          </section>
        </section>
        <footer class="page-footer">
          <span>QuIVer · Evaluation archive</span>
          <a href="../README.md"><span data-i18n="资料目录 ↗">资料目录 ↗</span></a>
        </footer>
      </div>
    </main>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside
      class="notes-drawer"
      id="notesDrawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <header>
        <h2 id="drawerTitle"></h2>
        <button
          class="icon-button"
          id="closeDrawer"
          aria-label="关闭备注"
          data-i18n-aria-label="关闭备注"
        >
          ×
        </button>
      </header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript>
      <span data-i18n="启用 JavaScript 后可浏览交互看板。完整记录可通过上方 CSV 链接下载。">
        启用 JavaScript 后可浏览交互看板。完整记录可通过上方 CSV 链接下载。
      </span>
    </noscript>
  </body>
</html>
