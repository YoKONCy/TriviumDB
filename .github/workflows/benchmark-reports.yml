# TriviumDB Benchmark 报告管线
#
# 这个 workflow 不接入常规 push / pull_request 门禁，只通过手动触发或定时任务运行。
# 所有 benchmark job 都只产出报告 artifact，不作为合并门禁。

name: Benchmark Reports

on:
  workflow_dispatch:
  schedule:
    # 每周六 UTC 05:00（北京时间 13:00）生成一次报告
    - cron: '0 5 * * 6'

env:
  CARGO_TERM_COLOR: always

jobs:
  entry-coverage-report:
    name: Main Entry Coverage Report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-entry-coverage

      - name: 生成主入口性能/资源/正确率报告
        run: cargo bench --bench ci_report

      - name: 上传主入口 benchmark 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-entry-benchmark-report
          path: target/bench-reports/

  criterion-query-report:
    name: Query Criterion Report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-query-criterion

      - name: 运行查询与写入 Criterion benchmark
        run: cargo bench --bench bench_queries

      - name: 上传 Criterion HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-query-report
          path: target/criterion/
  index-graph-baseline-report:
    name: Index Graph Baseline Report
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-index-graph-baseline

      - name: 运行索引与图基线报告
        env:
          TRIVIUM_BASELINE_NODES: '100000'
          TRIVIUM_BASELINE_QUERIES: '100'
          TRIVIUM_BASELINE_DIM: '768'
          TRIVIUM_BASELINE_DEGREE: '4'
        run: cargo bench --bench bench_index_graph_baseline

      - name: 上传索引与图 benchmark 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-graph-benchmark-report
          path: target/bench-reports/
          if-no-files-found: warn
