# TriviumDB Benchmark 报告管线
#
# 这个 workflow 不接入常规 push / pull_request 门禁，只通过手动触发或定时任务运行。
# 所有 benchmark job 都只产出报告 artifact，不作为合并门禁。

name: Benchmark Reports

on:
  workflow_dispatch:
    inputs:
      run_extreme:
        description: '是否运行 50万节点/1000万边/1536维极限 benchmark'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # 每周六 UTC 05:00（北京时间 13:00）生成一次报告
    - cron: '0 5 * * 6'

env:
  CARGO_TERM_COLOR: always

jobs:
  entry-coverage-report:
    name: Main Entry Coverage Report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-entry-coverage

      - name: 生成主入口性能/资源/正确率报告
        run: cargo bench --bench ci_report

      - name: 上传主入口 benchmark 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-entry-benchmark-report
          path: target/bench-report/

  criterion-query-report:
    name: Query Criterion Report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-query-criterion

      - name: 运行查询与写入 Criterion benchmark
        run: cargo bench --bench bench_queries

      - name: 上传 Criterion HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-query-report
          path: target/criterion/


  extreme-graph-vector-report:
    name: Extreme Graph Vector Report
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_extreme == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-extreme-graph-vector

      - name: 运行 50万节点/1000万边/1536维极限 benchmark 报告
        run: cargo bench --bench bench_extreme_graph_vector

      - name: 上传极限规模 benchmark 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extreme-graph-vector-benchmark-report
          path: target/bench-report/
