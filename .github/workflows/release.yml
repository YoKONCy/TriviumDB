name: Publish to PyPI & NPM

# GitHub 使用 glob 过滤 Tag；版本门禁再严格限定 beta/stable
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要恢复发布的现有 beta/stable Tag'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  # ═══════════════════════════════════════════════════════════
  #  阶段 0: 版本预检（PyPI / NPM 是否已存在相同或更新版本）
  # ═══════════════════════════════════════════════════════════
  version-gate:
    name: Version Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pypi_should_publish: ${{ steps.check_pypi.outputs.should_publish }}
      npm_should_publish: ${{ steps.check_npm.outputs.should_publish }}
      version: ${{ steps.extract.outputs.version }}
      channel: ${{ steps.extract.outputs.channel }}
    steps:
      - name: 检出工作流版本的发布校验器
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 保存发布校验器
        run: cp scripts/validate_release_source.py "$RUNNER_TEMP/tdb-validate-release-source.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: 提取并校验版本号
        id: extract
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "只允许 beta（vX.Y.Z-beta.N）或 stable（vX.Y.Z）Tag 进入三端发布"
            exit 1
          fi
          VERSION="${TAG#v}"
          CHANNEL="stable"
          if [[ "$VERSION" == *-beta.* ]]; then
            CHANNEL="beta"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "当前发布版本: $VERSION ($CHANNEL)"

      - name: 校验 Release Commit 来源
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/tdb-validate-release-source.py" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"


      - name: 检查 PyPI 是否已发布
        id: check_pypi
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/triviumdb/${VERSION}/json")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "⏭️  PyPI 已存在 triviumdb==${VERSION}，跳过发布"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ PyPI 未找到 triviumdb==${VERSION}，准备发布"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查 NPM 是否已发布
        id: check_npm
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          # npm view 返回版本号或空
          EXISTING=$(npm view triviumdb@${VERSION} version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "⏭️  NPM 已存在 triviumdb@${VERSION}，跳过发布"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ NPM 未找到 triviumdb@${VERSION}，准备发布"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    needs: version-gate
    if: needs.version-gate.outputs.pypi_should_publish == 'true' || needs.version-gate.outputs.npm_should_publish == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 校验发布版本
        shell: bash
        run: |
          VERSION="${{ needs.version-gate.outputs.version }}"
          test "$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "triviumdb"))')" = "$VERSION"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          PYTHON_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${{ needs.version-gate.outputs.channel }}" == "beta" ]]; then
            EXPECTED_PYTHON_VERSION=$(echo "$VERSION" | sed -E 's/-beta\.([0-9]+)$/b\1/')
          else
            EXPECTED_PYTHON_VERSION="$VERSION"
          fi
          test "$PYTHON_VERSION" = "$EXPECTED_PYTHON_VERSION"

      - name: 运行发布质量门禁
        run: |
          cargo fmt -p triviumdb -p triviumdb-cli -- --check
          cargo check --workspace --exclude triviumdb-server --all-targets
          cargo check --lib --features python
          cargo check --lib --features nodejs
          cargo test --workspace --exclude triviumdb-server -- --test-threads=1
          cargo test --features test-hooks --test concurrency --test differential --test fault_io --test fault_power -- --test-threads=1
          cargo test --features test-hooks --test query tql_planner -- --test-threads=1
          cargo clippy --workspace --exclude triviumdb-server --all-targets -- -D warnings
          npm install --no-audit --no-fund
          npm run test:types

  # ═══════════════════════════════════════════════════════════
  #  阶段 1: 编译 Python Wheels（含 ARM64）
  # ═══════════════════════════════════════════════════════════
  build-wheels:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.pypi_should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sdist: true
          - name: Linux ARM64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            sdist: false
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            sdist: false
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            sdist: false
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            sdist: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --features python -o dist ${{ matrix.sdist && '--sdist' || '' }}
          rust-toolchain: stable
          # Linux ARM64 使用 manylinux 2_28 + Zig 交叉编译，避免 Docker 镜像解压失败
          manylinux: ${{ contains(matrix.target, 'aarch64') && '2_28' || 'auto' }}
          docker-options: ${{ contains(matrix.target, 'aarch64-unknown-linux') && '-e JEMALLOC_SYS_WITH_LG_PAGE=16' || '' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  # ═══════════════════════════════════════════════════════════
  #  阶段 2: 发布到 PyPI
  # ═══════════════════════════════════════════════════════════
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [version-gate, build-wheels]
    if: needs.version-gate.outputs.pypi_should_publish == 'true'
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  #  阶段 3: 编译 Node.js native addon（含 ARM64）
  # ═══════════════════════════════════════════════════════════
  build-node:
    name: Build Node addon (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.npm_should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux ARM64 交叉编译需要 gcc-aarch64
      - name: Install cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: npm install

      - name: Build node module
        run: npx napi build --platform --release --features nodejs --target ${{ matrix.target }}
        env:
          # Linux ARM64 交叉编译需要指定链接器
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload node binding
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.name }}
          path: "*.node"

  # ═══════════════════════════════════════════════════════════
  #  阶段 4: 发布到 NPM
  # ═══════════════════════════════════════════════════════════
  release-npm:
    name: Release to NPM
    runs-on: ubuntu-latest
    needs: [version-gate, build-node]
    if: needs.version-gate.outputs.npm_should_publish == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: dtolnay/rust-toolchain@stable

      - name: Download all bindings
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: node-*
          merge-multiple: true

      - name: 验证待发布的 Node 包
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run test:package
          npm run test:public-api
          npm run test:lifecycle
          npm run test:resource-lifecycle
          npm run test:process-lifecycle

      - name: Publish to NPM
        shell: bash
        run: |
          CHANNEL="${{ needs.version-gate.outputs.channel }}"
          if [[ "$CHANNEL" == "beta" ]]; then
            npm publish --ignore-scripts --tag beta
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  #  阶段 5: 发布摘要（无论跳过还是发布都输出结果）
  # ═══════════════════════════════════════════════════════════
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [version-gate, release, release-npm]
    if: always()
    steps:
      - name: 输出发布摘要
        run: |
          echo "## Release Summary: v${{ needs.version-gate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **crates.io**: 由维护者在本地手动发布" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.version-gate.outputs.pypi_should_publish }}" = "true" ]; then
            echo "- **PyPI**: ✅ 已发布 triviumdb==${{ needs.version-gate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **PyPI**: ⏭️ 跳过（版本已存在）" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.version-gate.outputs.npm_should_publish }}" = "true" ]; then
            echo "- **NPM**: ✅ 已发布 triviumdb@${{ needs.version-gate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **NPM**: ⏭️ 跳过（版本已存在）" >> $GITHUB_STEP_SUMMARY
          fi
