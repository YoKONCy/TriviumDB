# nightly Server 的非 UI 契约；禁止在此运行浏览器、UI/UX、视觉或耗时阈值验收。
name: Nightly Server Contracts

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server HTTP and Transaction Contracts
    runs-on: windows-latest
    # 基础设施挂起保护，不作为产品耗时指标。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-contracts
      - name: 验证 Server 非 UI 契约
        run: cargo test --locked -p triviumdb-server
      - name: 打包宿主接入资源
        run: python scripts/package_console.py --output .tmp/console/triviumdb-console.zip
      - name: 上传宿主接入资源
        uses: actions/upload-artifact@v4
        with:
          name: triviumdb-console
          include-hidden-files: true
          path: .tmp/console/triviumdb-console.zip
          if-no-files-found: error
