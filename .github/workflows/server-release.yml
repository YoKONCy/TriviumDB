name: Publish Server Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要恢复发布的现有 beta/stable Tag'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  quality-gate:
    name: Server Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: 检出工作流版本的发布校验器
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 保存发布校验器
        run: cp scripts/validate_release_source.py "$RUNNER_TEMP/tdb-validate-release-source.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 校验 Release Commit 来源
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/tdb-validate-release-source.py" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: 校验版本与运行门禁
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "只允许 beta 或 stable Tag 进入 Server 发布"
            exit 1
          fi
          test "$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "triviumdb-server"))')" = "$VERSION"
          cargo fmt --all -- --check
          cargo test -p triviumdb-server -- --test-threads=1
          cargo clippy -p triviumdb-server --all-targets -- -D warnings

  build:
    name: Build Server (${{ matrix.name }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: Linux ARM64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}
      - name: 安装 Linux ARM64 交叉编译器
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: 构建 Server
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release -p triviumdb-server --target "${{ matrix.target }}"
      - name: 打包 Unix 二进制
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="triviumdb-server-v${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/triviumdb-server" "$NAME/"
          cp LICENSE "$NAME/"
          tar -czf "${NAME}.tar.gz" "$NAME"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - name: 打包 Windows 二进制
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = "$env:RELEASE_TAG" -replace '^v', ''
          $Name = "triviumdb-server-v$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/triviumdb-server.exe" "$Name/"
          Copy-Item LICENSE "$Name/"
          Compress-Archive -Path $Name -DestinationPath "$Name.zip"
          $Hash = (Get-FileHash "$Name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Name.zip" | Set-Content -NoNewline "$Name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: |
            triviumdb-server-*.tar.gz
            triviumdb-server-*.tar.gz.sha256
            triviumdb-server-*.zip
            triviumdb-server-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish Server Release Assets
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: server-*
          merge-multiple: true
      - name: 选择同版本双语发版说明
        id: notes
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES="docs/changes/${VERSION}.md"
          test -s "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
      - name: 发布 GitHub Release 附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta.') }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
